[package]
name = "notmynet-windows"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[features]
default = ["desktop"]
desktop = ["dep:gpui-kit"]

[[bin]]
name = "notmynet-windows"
path = "src/main.rs"
required-features = ["desktop"]

[target.'cfg(windows)'.dependencies]
gpui-kit = { version = "=0.10.0", optional = true }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_System_IO", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging"] }
